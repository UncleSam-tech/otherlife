[package]
name = "otherlife_desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "otherlife_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
otherlife_simulation = { path = "../../../crates/simulation" }
otherlife_world = { path = "../../../crates/world" }
otherlife_actions = { path = "../../../crates/actions" }
otherlife_persistence = { path = "../../../crates/persistence" }
otherlife_ai_bridge = { path = "../../../crates/ai_bridge" }
otherlife_rng = { path = "../../../crates/rng" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
